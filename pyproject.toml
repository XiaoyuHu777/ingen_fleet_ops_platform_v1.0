[project]
name = "ingen-fleet-ops-platform"
version = "0.1.0"
description = "Robot fleet operations and signed model artifact registry"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "psycopg[binary]==3.3.6",
    "minio==7.2.20",
    "uvicorn==0.54.0",
    "sqlalchemy==2.0.44",
    "alembic==1.17.1",
    "tzdata==2026.5",
    "cryptography==46.0.5",
]

[dependency-groups]
packaging = [
    "numpy==2.2.6",
    "onnx==1.19.1",
    "onnxruntime==1.22.1",
    "torch==2.8.0",
    "transformers==4.55.4",
]
dev = [
    "black==26.10.1",
    "httpx==0.28.1",
    "jsonschema==4.25.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
files = ["agent", "services", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=services.registry --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
