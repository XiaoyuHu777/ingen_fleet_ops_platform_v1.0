[project]
name = "ingen-fleet-ops-platform"
version = "0.1.0"
description = "Week 1 robot fleet operations infrastructure foundation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "psycopg[binary]==3.3.6",
    "minio==7.2.20",
    "uvicorn==0.54.0",
    "sqlalchemy==2.0.44",
    "alembic==1.17.1",
    "tzdata==2026.5",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "httpx==0.28.1",
    "jsonschema==4.25.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
files = ["services", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=services.registry --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
