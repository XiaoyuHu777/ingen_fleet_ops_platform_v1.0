global:
  scrape_interval: 2s
  scrape_timeout: 1s

scrape_configs:
  - job_name: registry
    authorization:
      credentials_file: /run/secrets/registry_metrics_token
    static_configs:
      - targets: [registry:8000]

  - job_name: fleet-agent
    dns_sd_configs:
      - names: [fleet-agent]
        type: A
        port: 9101
        refresh_interval: 2s
