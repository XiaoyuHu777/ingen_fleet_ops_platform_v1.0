services:
  registry:
    environment:
      REGISTRY_METRICS_TOKEN_FILE: /run/secrets/registry_metrics_token
    secrets:
      - registry_metrics_token

  prometheus:
    image: prom/prometheus:v3.11.3
    volumes:
      - ../../observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    secrets:
      - registry_metrics_token
    ports:
      - "127.0.0.1:${W05_PROMETHEUS_PORT:-9095}:9090"

  grafana:
    image: grafana/grafana:12.4.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${W05_GRAFANA_PORT:-3005}:3000"

secrets:
  registry_metrics_token:
    file: ${W05_RUN_DIR:-../../.week5/convergence}/prometheus-registry.token
